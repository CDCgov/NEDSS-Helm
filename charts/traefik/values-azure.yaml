# Traefik Ingress Controller - Azure (AKS) Configuration
# (Replaces: NEDSS-Helm/charts/nginx-ingress/values-azure.yaml)

image:
  tag: v3.7.5

nodeSelector:
  kubernetes.io/os: linux

deployment:
  enabled: true
  kind: Deployment
  replicas: 1
  podAnnotations:
    linkerd.io/inject: enabled

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false
    allowEmptyServices: true
  kubernetesIngress:
    enabled: true
    allowEmptyServices: true
    publishedService:
      enabled: true

ports:
  traefik:
    port: 9000
    expose:
      default: false
    protocol: TCP
  # HTTP entrypoint:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
    forwardedHeaders:
      insecure: true
    transport:
      respondingTimeouts:
        readTimeout: "300s"
        writeTimeout: "300s"
        idleTimeout: "300s"
  # HTTPS entrypoint:
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
    http:
      tls: {}
    forwardedHeaders:
      insecure: true
    transport:
      respondingTimeouts:
        readTimeout: "300s"
        writeTimeout: "300s"
        idleTimeout: "300s"
  # Metrics port for Prometheus scraping:
  metrics:
    port: 9100
    expose:
      default: false
    protocol: TCP

service:
  enabled: true
  type: LoadBalancer
  spec:
    externalTrafficPolicy: "Local"
    loadBalancerIP: EXAMPLE_XX.XX.XX.XX # Populate with the private IP of your load balancer in Azure. (Also, see the helm command documented at the bottom of this file.)
  annotations:
    # For private IP and private cluster use the following:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-internal-health-probe-request-path: "/ping"
    #
    prometheus.io/scrape: "true"
    prometheus.io/port: "9100"
    prometheus.io/path: /metrics

additionalArguments:
  - "--serversTransport.forwardingTimeouts.dialTimeout=300s"
  - "--serversTransport.forwardingTimeouts.responseHeaderTimeout=300s"
  - "--serversTransport.forwardingTimeouts.idleConnTimeout=300s"
  - "--entryPoints.websecure.http.tls"

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

log:
  level: INFO
accessLog:
  enabled: true

# DASHBOARD
# Traefik includes a built-in dashboard - useful for debugging routes
# Do NOT expose externally in production
ingressRoute:
  dashboard:
    enabled: true
    entryPoints: ["traefik"]

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

rbac:
  enabled: true

# Run the following command (from your NEDSS-Helm/charts/ directory) if/when the load balancer IP is updated:
# helm upgrade --install traefik traefik/traefik --namespace traefik --create-namespace -f ./traefik/values-azure.yaml --set service.spec.loadBalancerIP=EXAMPLE_XX.XX.XX.XX
