apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "case-notification-service.fullname" . }}
  labels:
    {{- include "case-notification-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "case-notification-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "case-notification-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "case-notification-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and .Values.linkerd .Values.linkerd.enabled .Values.linkerd.waitForStartup }}
      initContainers:
        - name: wait-for-linkerd
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Linkerd proxy injector service..."
              until nslookup linkerd-proxy-injector.linkerd.svc.cluster.local > /dev/null 2>&1; do
                echo "Linkerd service not found, retrying in 2s..."
                sleep 2
              done
              echo "Linkerd proxy injector service is available!"
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: CN_AUTH_URI
              value: {{ .Values.authUri }}
            - name: NBS_DBSERVER
              value: {{ .Values.jdbc.dbserver }}
            - name: NBS_DBUSER
              value: {{ .Values.jdbc.username }}
            - name: NBS_DBPASSWORD
              value: {{ .Values.jdbc.password }}
            - name: CN_SERVER_HOST
              value: {{ .Values.ingressHost }}
            - name: KAFKA_BOOTSTRAP_SERVER
              value: {{ .Values.kafka.cluster }}
            - name: SERVICE_TZ
              value: {{ .Values.timezone }}
            - name: NND_DE_CLIENT_ID
              value: {{ .Values.api.clientId}}
            - name: NND_DE_SECRET
              value: {{ .Values.api.secret}}
            # - name: SPRING_PROFILES_ACTIVE
            #   value: "{{ .Values.springBootProfile}}"
