replicaCount: 1

image:
  #repository: "public.ecr.aws/o1z7u2g7/cdc-nbs-modernization/elasticsearch"
  repository: "quay.io/us-cdcgov/cdc-nbs-modernization/elasticsearch"
  pullPolicy: IfNotPresent
  tag: "v1.0.4"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # If 'create' is "true" then either/both of the following two values can optionally be set to non-default values, otherwise those two values are ignored.
  annotations: {}
  name: ""

podAnnotations: {}

securityContext:
  # The following two values should be left as-is (unless if you have a specific reason to change them)
  runAsUser: 1000
  fsGroup: 1000

service:
  # The following three values should be left as-is (unless if you have a specific reason to change them)
  type: ClusterIP
  port: 9200
  port2: 9300

ingress:
  enabled: false
  # Generally this should be disabled (in which case the following values are ignored)
  className: ""
  annotations: {}
  tls: []

resources: 
  limits:
    cpu: "1000m"
    memory: "3Gi"
  requests:
    cpu: "500m"
    memory: "1536Mi"

autoscaling:
  enabled: false
  # When this is disabled then the following values are ignored
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  #targetMemoryUtilizationPercentage: 80

# The following three values should be left as-is (unless if you have a specific reason to set them)
nodeSelector: {}
tolerations: []
affinity: {}


# "aws" and "azure" are the supported values
cloudProvider: aws

# For Azure (used to create a PVC and StorageClass):
azure:
  files:
    storageRequest: 100Gi
    # The storage account created by the NEDSS-Infrastructure/terraform/azure/modules/1-nbs7/storage-account module (see NEDSS-Infrastructure/terraform/azure/samples/1-nbs7/ for an example of that module being used):
    storageAccountName: "EXAMPLE_STORAGE_ACCOUNT_NAME"
    # The resource group (specified by NEDSS-Infrastructure/terraform/azure/samples/1-nbs7/terraform.tfvars) where the storage account lives:
    resourceGroupName: "EXAMPLE_RESOURCE_GROUP_NAME"

# For AWS:
pvc:
  esPvClaim:
    storageClass: efs-es
    storageRequest: 100Gi
# Used to create a StorageClass:
efsFileSystemId: "EXAMPLE_EFS_ID"
