apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elasticsearch.fullname" . }}
  labels:
    {{- include "elasticsearch.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "elasticsearch.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "elasticsearch.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "elasticsearch.serviceAccountName" . }}
      {{- if and .Values.linkerd .Values.linkerd.enabled .Values.linkerd.waitForStartup }}
      initContainers:
        - name: wait-for-linkerd
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Linkerd proxy injector service..."
              until nslookup linkerd-proxy-injector.linkerd.svc.cluster.local > /dev/null 2>&1; do
                echo "Linkerd service not found, retrying in 2s..."
                sleep 2
              done
              echo "Linkerd proxy injector service is available!"
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "elasticsearch.fullname" . }}-config
          ports:
            - containerPort: 9200
              protocol: TCP
          securityContext:
            runAsUser:  {{ .Values.securityContext.runAsUser }}
          volumeMounts:
          - mountPath: /usr/share/elasticsearch/data
            name: es-persistent-storage      
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: {{ .Values.securityContext.fsGroup }}
      volumes:
      - name: es-persistent-storage
        persistentVolumeClaim:
          claimName: {{ include "elasticsearch.fullname" . }}-es-pv-claim
