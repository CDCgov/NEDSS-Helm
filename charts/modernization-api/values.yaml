# NOTE: Unless otherwise specified, all values in this file are used only by the modernization-api pod.

# Info about the 'probes' nested values in this file: 
# * If probes.*.enabled is disabled then the other sibling keys (under that probes.* parent) are ignored,
# * otherwise any of those commented out sibling keys can be uncommented and modified if you wish to specify a different value than the default values specified in  ./templates/deployment*.yaml

# Number of Pods maintained
replicaCount: 1

image:
  repository: "quay.io/us-cdcgov/cdc-nbs-modernization/modernization-api"
  pullPolicy: IfNotPresent
  tag: "v1.5.2"

imagePullSecrets: [] # Used by both pods (i.e. modernization-api and modernization-api-report-execution)

# Replaces name of chart on install:
nameOverride: ""
# Replaces full generated name on install:
fullnameOverride: ""

serviceAccount:
  create: true
  # If 'create' is "true" then either/both of the following two values can optionally be set to non-default values, otherwise those two values are ignored.
  annotations: {}
  name: ""

podAnnotations: {}

# Defines privilege and access control (../elasticsearch/values.yaml has an example of setting 'securityContext' to a non-default value). Used by both pods.
podSecurityContext: {}
securityContext: {}

# Configures the Kubernetes Service
service:
  type: ClusterIP
  port: 8080
  httpsPort: 443
  gatewayPort: 8000

pageBuilder:
  enabled: "false"
  page:
    library:
      enabled: "false"
    management:
      create:
        enabled: "false"
      edit:
        enabled: "false"

# Change this to the DNS record of the legacy NBS hostname.
nbsExternalName: app-classic.EXAMPLE_DOMAIN

resources:
  limits:
    cpu: "500m"
    memory: "2Gi"
  requests:
    cpu: "250m"
    memory: "768Mi"

# Kubernetes Pod autoscaler
autoscaling:
  enabled: false
  # When this is disabled then the following values are ignored
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Node assignment to Pod (used by both pods)
nodeSelector: {}

# The Pod's tolerations (used by both pods)
tolerations: []

# The Pod's scheduling constraints - e.g. co-locate this pod in the same node, zone, etc. as some other pod(s). Used by both pods.
affinity: {}

# Set this to the NBS7 A record (hostname), for the NBS application subdomain. 
# EXAMPLE_DOMAIN is <DOMAIN_NAME.TLD> i.e. the site and domain names. (TLD stands for Top Level Domain).
ingressHost: "app.EXAMPLE_DOMAIN"

# The timezone to initialize the JVM with
timezone: "UTC"

# "elasticsearch" in the following URL must match the name of the Kubernetes Deployment created by the ../elasticsearch/ Helm chart.
elasticSearchHost: "http://elasticsearch.default.svc.cluster.local:9200"

jdbc:
  connectionString: "jdbc:sqlserver://EXAMPLE_DB_ENDPOINT:1433;databaseName=EXAMPLE_DB_NAME;user=EXAMPLE_ODSE_DB_USER;password=EXAMPLE_ODSE_DB_USER_PASSWORD;encrypt=true;trustServerCertificate=true;"
  user: "EXAMPLE_ODSE_DB_USER"
  password: "EXAMPLE_ODSE_DB_USER_PASSWORD"

# Used primarily by the modernization-api-report-execution pod:
reportExecution:
  enabled: true
  replicaCount: 1
  image:
    repository: "quay.io/us-cdcgov/cdc-nbs-modernization/report-execution"
    pullPolicy: IfNotPresent
    tag: "v1.0.1"
  service:
    type: ClusterIP
    port: 8001
  database:
    connectionString: "Server=EXAMPLE_DB_ENDPOINT;UID=EXAMPLE_ODSE_DB_USER;PWD=EXAMPLE_ODSE_DB_USER_PASSWORD;Database=NBS_ODSE;TrustServerCertificate=yes;"
  # Maximum size in number of characters of the CSV-ified report result
  max_report_size: 2000000000 # 100k rows x 1000 cols x 20chars
  logLevel: "INFO"
  resources:
    limits:
      memory: "3Gi"
      cpu: "500m"
    requests:
      memory: "3Gi"
      cpu: "500m"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  probes:
    readiness:
      enabled: true
      path: /status
      #initialDelaySeconds: xx
      #periodSeconds: xx
      #failureThreshold: x
    liveness:
      enabled: true
      path: /status
      #initialDelaySeconds: xx
      #periodSeconds: xx
      #failureThreshold: x

security:
  # Used to encrypt JWT
  # Random value can be generated by running: openssl rand -base64 64 | tr -d '\n'
  tokenSecret: "EXAMPLE_TOKEN_SECRET"
  # Used to encrypt search parameters
  # Random value can be generated by running: openssl rand -base64 32 | cut -c1-32
  parameterSecret: "EXAMPLE_PARAMETER_SECRET"

# (Note that OIDC is configured further by the ../nbs-gateway Helm chart)
oidc:
  enabled: "true"
  # If a non-null value is not specified on the following line for the 'uri' key then by default in ./templates/deployment.yaml this is used: https://{{ .Values.ingressHost }}/auth/realms/nbs-users
  #uri:

# Environment specific values that are provided to the modernized ui
ui:
  # Settings:
  smarty:
    # The embedded API key used to authenticate the PostHog analytics client - or when blank then the Smarty API will not be invoked.
    key:
  analytics: # Settings for the analytics used by the modernized ui
    # The host name of the PostHog server to send analytics to
    host: "https://us.i.posthog.com"
    # The PostHog project key to associate frontend analytics with (i.e. the key used to authenticate the PostHog client); or when blank then analytics will not be enabled.
    key:
  defaults:
    # The default sizing of components
    sizing: "small"
  #
  # Feature flags:
  search:
    events:
      # Enables access to NBS6 Event Search
      enabled: true
    investigations:
      # Enables access to modernized Investigation search
      enabled: false
    laboratoryReports:
      # Enables access to modernized Laboratory search
      enabled: false
  patient:
    file:
      # Enables access to the modernized Patient File
      enabled: false
      # Enables presence of Merge History card in Patient File
      mergeHistory:
        enabled: false
    search:
      filters:
        # [deprecated]  Enables access to modernized Patient search filters. (marked for removal)
        enabled: true
  deduplication:
    # Enable access to Deduplication screens
    enabled: false
    merge:
      # Enable access to Deduplication merge screens
      enabled: false
  system:
    management:
      # Enable access to System Management screen
      enabled: false
  report:
    execution:
      # Enables access to modernized report execution
      enabled: true

probes:
  readiness:
    enabled: true
    #port: xxxx
    #initialDelaySeconds: xx
    #periodSeconds: xx
    #failureThreshold: x
  liveness:
    enabled: true
    #port: xxxx
    #initialDelaySeconds: xx
    #periodSeconds: xx
    #failureThreshold: x

spring:
  liquibase:
    enabled: true
