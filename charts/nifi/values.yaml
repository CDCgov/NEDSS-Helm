replicaCount: 1

image:
  repository: "quay.io/us-cdcgov/cdc-nbs-modernization/nifi"
  pullPolicy: IfNotPresent
  tag: "v1.1.1"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # If 'create' is "true" then either/both of the following two values can optionally be set to non-default values, otherwise those two values are ignored.
  annotations: {}
  name: ""

podAnnotations: {}

# Defines privilege and access control (../elasticsearch/values.yaml has an example of setting 'securityContext' to a non-default value).
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8443

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/upstream-vhost: "localhost:8443"
    nginx.ingress.kubernetes.io/proxy-redirect-from: "https://localhost:8443"
    nginx.ingress.kubernetes.io/proxy-redirect-to: "https://nifi.EXAMPLE_DOMAIN"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
  tls:
    - secretName: nifi.EXAMPLE_DOMAIN
      hosts:
        - nifi.EXAMPLE_DOMAIN
  hosts:
    - host: nifi.EXAMPLE_DOMAIN
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nifi
            port:
              number: 8443

resources: 
  limits:
    cpu: "1000m"
    memory: "3Gi"
  requests:
    cpu: "500m"
    memory: "1536Mi"

# Kubernetes Pod autoscaler
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

containerPort: 8443


# "aws" and "azure" are the supported values
cloudProvider: aws

# For Azure:
azure:
  files:
    storageRequest: 50Gi
    # Please see the commentary in ../elasticsearch/values.yaml about these values
    storageAccountName: "EXAMPLE_STORAGE_ACCOUNT_NAME"
    resourceGroupName: "EXAMPLE_RESOURCE_GROUP_NAME"

# For AWS:
pvc:
  nifiPvClaim:
    storageRequest: 50Gi
efsFileSystemId: "EXAMPLE_EFS_ID"


### Environment variables for the NiFi container: ###

jvmheap:
  init: "1g"
  max: "2g"

jdbcConnectionString: "jdbc:sqlserver://EXAMPLE_DB_ENDPOINT:1433;databaseName=EXAMPLE_DB_NAME;user=EXAMPLE_ODSE_DB_USER;password=EXAMPLE_ODSE_DB_USER_PASSWORD;encrypt=true;trustServerCertificate=true;"

# "elasticsearch" in the following URL must match the name of the Kubernetes Deployment created by the ../elasticsearch/ Helm chart.
elasticSearchHost: "http://elasticsearch.default.svc.cluster.local:9200"

# Choose any username except admin.
singleUserCredentialsUsername: "EXAMPLE_NIFI_ADMIN_USER"
# The following password must be a minimum of 12 characters.
singleUserCredentialsPassword: "EXAMPLE_NIFI_ADMIN_USER_PASSWORD"

# Specifies the source string used to derive an encryption key. This is not the encryption key itself, but the password from which NiFi derives the actual encryption key.
# Generate a random value of at least 12 characters with: openssl rand -base64 32 | cut -c1-32
nifiSensitivePropsKey: "EXAMPLE_NIFI_SENSITIVE_PROPS"
